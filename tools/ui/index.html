<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceef7" media="(prefers-color-scheme: light)">
<title>Qwen-Image 2.1 local</title>
<style>
  /* ------------------------------------------------------------ jetons : sombre par défaut, clair selon le système */
  :root {
    color-scheme: dark;
    --void:#0b0a16; --ink:#f6f4ff; --ink2:rgba(236,233,255,.68); --ink3:rgba(236,233,255,.42);
    --iris:#8f7cff; --iris2:#b9a9ff; --on-iris:#fff;
    --ok:#3ddc97; --warn:#ffb547; --err:#ff6b7a;
    --glass:rgba(255,255,255,.07); --glass-hi:rgba(255,255,255,.15); --field:rgba(8,6,20,.32);
    --rim:rgba(255,255,255,.14); --spec:rgba(255,255,255,.55);
    --shadow:0 18px 50px -18px rgba(0,0,0,.7);
    --veil:linear-gradient(180deg, rgba(11,10,22,.30), rgba(11,10,22,.62) 55%, rgba(11,10,22,.80));
    --blur:blur(26px) saturate(185%); --thick:rgba(26,22,48,.72);
    --spring:cubic-bezier(.34,1.45,.5,1); --ease:cubic-bezier(.2,.9,.25,1);
    --r-xl:30px; --r-l:22px; --r-m:16px; --r-s:12px;
  }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light;
      --void:#eceef7; --ink:#15131f; --ink2:rgba(21,19,31,.64); --ink3:rgba(21,19,31,.42);
      --iris:#6a52ff; --iris2:#8f7cff;
      --glass:rgba(255,255,255,.42); --glass-hi:rgba(255,255,255,.78); --field:rgba(255,255,255,.55);
      --rim:rgba(255,255,255,.75); --spec:#fff;
      --shadow:0 18px 50px -22px rgba(40,30,100,.38); --thick:rgba(250,250,255,.80);
      --veil:linear-gradient(180deg, rgba(236,238,247,.25), rgba(236,238,247,.55) 55%, rgba(236,238,247,.72)); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { font:16px/1.45 system-ui, -apple-system, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif; color:var(--ink);
    background:var(--void); min-height:100dvh; -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 0; }
  button, input, select, textarea { font:inherit; color:inherit; }

  /* ------------------------------------------------------------ fond : la dernière image, floutée, éclaire le verre */
  .ambient { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; background:var(--void); }
  .ambient .mesh { position:absolute; inset:-20%; background:
      radial-gradient(40% 35% at 20% 18%, rgba(143,124,255,.55), transparent 70%),
      radial-gradient(38% 32% at 85% 30%, rgba(255,120,190,.30), transparent 70%),
      radial-gradient(45% 40% at 60% 92%, rgba(60,200,255,.28), transparent 70%);
    animation:drift 28s ease-in-out infinite alternate; }
  .ambient img { position:absolute; inset:-15%; width:130%; height:130%; object-fit:cover; opacity:0;
    filter:blur(60px) saturate(1.7); transform:scale(1.1); transition:opacity 1.4s ease; }
  .ambient img.on { opacity:.95; }
  .ambient::after { content:""; position:absolute; inset:0; background:var(--veil); }
  @keyframes drift { 0% { transform:translate(0,0) rotate(0); } 100% { transform:translate(4%,-3%) rotate(8deg); } }

  /* ------------------------------------------------------------ verre liquide : remplissage, flou, liseré spéculaire */
  .glass { position:relative; background:linear-gradient(180deg, var(--glass-hi), var(--glass));
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--rim);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), var(--shadow); }
  .glass::before { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px; pointer-events:none;
    background:linear-gradient(140deg, var(--spec), transparent 28%, transparent 70%, rgba(255,255,255,.22));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }

  /* ------------------------------------------------------------ barre du haut : marque et pastille d'état */
  .topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .topbar::before { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none;
    background:linear-gradient(180deg, color-mix(in srgb, var(--void) 70%, transparent), transparent);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    -webkit-mask:linear-gradient(#000 60%, transparent); mask:linear-gradient(#000 60%, transparent); }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .logo { flex:none; width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:17px;
    background:radial-gradient(120% 120% at 25% 15%, #d4c9ff, var(--iris) 45%, #5a3fd8); box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 8px 22px -6px rgba(143,124,255,.75); }
  .topbar h1 { font-size:18px; margin:0; letter-spacing:-.02em; font-weight:720; white-space:nowrap; }
  .topbar h1 small { font-size:12px; font-weight:600; color:var(--ink3); margin-left:4px; letter-spacing:0; }
  .chipbtn { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:999px; cursor:pointer;
    font-size:14px; font-weight:600; color:var(--ink); }
  #phoneBtn { margin-left:auto; } #phoneBtn + .island { margin-left:0; }
  .island { margin-left:auto; min-width:0; max-width:60vw; }
  #status { display:flex; align-items:center; gap:8px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status::before { content:""; flex:none; width:8px; height:8px; border-radius:50%; background:var(--warn); box-shadow:0 0 10px var(--warn); }
  #status.ok::before { background:var(--ok); box-shadow:0 0 10px var(--ok); } #status.err::before { background:var(--err); box-shadow:0 0 10px var(--err); }
  @media (max-width: 700px) { #phoneBtn span { display:none; } #phoneBtn { padding:0 10px; } }

  /* ------------------------------------------------------------ barre d'onglets flottante, lentille qui glisse */
  .tabbar { position:fixed; z-index:30; left:50%; bottom:calc(12px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    width:min(440px, calc(100% - 24px)); height:66px; padding:5px; border-radius:999px; display:grid; grid-template-columns:repeat(4, 1fr); }
  .tabbar button { position:relative; z-index:1; border:0; background:none; cursor:pointer; color:var(--ink2); border-radius:999px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11.5px; font-weight:650; letter-spacing:.01em;
    transition:color .3s; }
  .tabbar button svg { width:24px; height:24px; transition:transform .45s var(--spring); }
  .tabbar button.active { color:var(--ink); }
  .tabbar button.active svg { transform:translateY(-1px) scale(1.08); color:var(--iris2); }
  .tabbar button:focus-visible { outline:2px solid var(--iris); outline-offset:-4px; }
  .lens { position:absolute; z-index:0; top:5px; bottom:5px; left:5px; width:calc((100% - 10px) / 4); border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.06));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -1px 0 rgba(255,255,255,.08), 0 6px 18px -6px rgba(0,0,0,.45);
    transition:transform .55s var(--spring); }
  @media (prefers-color-scheme: light) { .lens { background:linear-gradient(180deg, #fff, rgba(255,255,255,.7)); } }

  /* ------------------------------------------------------------ panneaux du bas (fenêtres centrées sur grand écran) */
  .scrim { position:fixed; inset:0; z-index:40; background:rgba(6,4,16,.42); opacity:0; pointer-events:none; transition:opacity .3s; }
  .scrim.on { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; z-index:50; left:50%; bottom:0; width:min(560px, 100%); max-height:88dvh; overflow:auto; overscroll-behavior:contain;
    padding:8px 20px calc(22px + env(safe-area-inset-bottom)); border-radius:32px 32px 0 0; background:var(--thick);
    transform:translate(-50%, 105%); visibility:hidden; transition:transform .45s var(--ease), visibility 0s linear .45s; }
  .sheet.on { transform:translate(-50%, 0); visibility:visible; transition:transform .45s var(--ease); }
  .sheet .grab { display:block; width:40px; height:5px; border:0; padding:0; border-radius:3px; background:var(--ink3); margin:2px auto 12px; cursor:grab; }
  .sheet h2 { font-size:20px; letter-spacing:-.02em; margin:0; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .sheet h3 { font-size:13px; font-weight:650; color:var(--ink2); margin:18px 2px 8px; }
  @media (min-width: 700px) {
    .sheet { bottom:auto; top:50%; border-radius:30px; opacity:0; transform:translate(-50%, -46%) scale(.97); padding-bottom:22px;
      transition:transform .3s var(--ease), opacity .25s, visibility 0s linear .3s; }
    .sheet.on { opacity:1; transform:translate(-50%, -50%); transition:transform .3s var(--ease), opacity .25s; }
    .sheet .grab { display:none; } }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:8px 0 0; font-size:15px; }
  .facts dt { color:var(--ink2); } .facts dd { margin:0; text-align:right; overflow-wrap:anywhere; }
  .facts .code { font-weight:700; letter-spacing:.08em; font-variant-numeric:tabular-nums; }
  .note { font-size:13px; color:var(--ink2); margin:8px 2px 0; }
  main { display:grid; grid-template-columns:minmax(340px, 520px) 1fr; align-items:start; gap:20px; padding:6px 20px calc(110px + env(safe-area-inset-bottom)); }
  @media (max-width: 980px) { main { grid-template-columns:minmax(0, 1fr); padding-inline:12px; gap:14px; } }
  .card { position:relative; border-radius:var(--r-xl); padding:16px; background:linear-gradient(180deg, var(--glass-hi), var(--glass));
    -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--rim); box-shadow:inset 0 1px 0 rgba(255,255,255,.18), var(--shadow); }
  .pane { display:none; } .pane.active { display:block; }
  .pane > label:first-child { margin-top:2px; }
  label { display:block; font-size:13px; color:var(--ink2); font-weight:600; margin:14px 2px 6px; }
  textarea, select { width:100%; padding:12px 14px; border:1px solid var(--rim); border-radius:var(--r-m); font-size:16px; background:var(--field); color:var(--ink); }
  textarea { min-height:104px; resize:vertical; line-height:1.45; }
  select { appearance:none; -webkit-appearance:none; text-overflow:ellipsis; padding-right:34px; cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink2) 50%), linear-gradient(135deg, var(--ink2) 50%, transparent 50%);
    background-position:calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
  select option { background:#1b1830; color:#f6f4ff; }
  textarea:focus, select:focus { outline:2px solid color-mix(in srgb, var(--iris) 55%, transparent); outline-offset:1px; }
  .col { display:flex; flex-direction:column; gap:14px; min-width:0; }
  body.m-t2i #panes { display:none; }

  /* ------------------------------------------------------------ compositeur : texte, pastilles de réglages, bouton */
  .composer { padding:6px 6px 6px; }
  .prompt { display:none; width:100%; min-height:118px; max-height:44dvh; border:0; background:transparent; resize:none; padding:12px 14px 10px;
    font-size:17px; line-height:1.45; letter-spacing:-.005em; field-sizing:content; }
  .prompt:focus { outline:none; }
  .prompt::placeholder { color:var(--ink3); }
  body.m-t2i .for-t2i, body.m-edit .for-edit, body.m-mask .for-mask { display:block; }
  .composer:focus-within { border-color:color-mix(in srgb, var(--iris) 55%, var(--rim)); }
  .opts { display:flex; gap:6px; padding:4px 8px 10px; overflow-x:auto; scrollbar-width:none; }
  .opts::-webkit-scrollbar { display:none; }
  .pill { flex:none; display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px; border-radius:999px; cursor:pointer;
    border:1px solid var(--rim); background:var(--field); color:var(--ink); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .pill:active { transform:scale(.96); }
  .pill.dim { color:var(--ink2); font-weight:500; }
  .shape { display:inline-block; flex:none; border:1.6px solid currentColor; border-radius:3px; }
  .pill .shape { opacity:.85; }
  .go-row { display:flex; gap:8px; align-items:stretch; }
  #go { flex:1; height:54px; font-size:17px; justify-content:center; }
  #go small { font-weight:600; font-size:14px; opacity:.78; margin-left:2px; font-variant-numeric:tabular-nums; }
  #go small.warn { color:#ffe2a8; opacity:1; }
  #go svg { width:20px; height:20px; }
  .btn-icon { flex:none; width:54px; height:54px; display:grid; place-items:center; border-radius:999px; cursor:pointer; color:var(--ink); }
  .btn-icon svg { width:22px; height:22px; }
  #cancel:disabled { display:none; }

  /* ------------------------------------------------------------ panneau Réglages */
  .ratios { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .chips5 { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
  .opt { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-width:0; padding:10px 2px 9px;
    border-radius:16px; border:1px solid var(--rim); background:var(--field); color:var(--ink2); cursor:pointer; transition:background .2s, color .2s, border-color .2s; }
  .opt b { font-size:14px; color:var(--ink); font-weight:650; }
  .opt small { font-size:10.5px; letter-spacing:-.01em; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .opt.ratio { padding-top:12px; } .opt.ratio .shape { margin-bottom:5px; }
  .opt.near::after { content:""; position:absolute; top:7px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--iris2); }
  .opt.on { color:var(--ink); border-color:color-mix(in srgb, var(--iris) 75%, transparent);
    background:linear-gradient(180deg, color-mix(in srgb, var(--iris) 34%, transparent), color-mix(in srgb, var(--iris) 16%, transparent));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
  .chips5 .opt b { font-size:13px; }
  #stepOpts .opt b { font-size:17px; }
  .switch { display:flex; align-items:center; gap:12px; margin:18px 2px 0; font-size:15px; color:var(--ink); cursor:pointer; }
  .switch input { position:absolute; opacity:0; pointer-events:none; }
  .switch .track { flex:none; position:relative; width:50px; height:30px; border-radius:999px; background:var(--field); border:1px solid var(--rim); transition:background .25s; }
  .switch .track::after { content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.3); transition:transform .35s var(--spring); }
  .switch input:checked + .track { background:var(--iris); }
  .switch input:checked + .track::after { transform:translateX(20px); }
  .switch input:focus-visible + .track { outline:2px solid var(--iris); outline-offset:2px; }
  .switch small { color:var(--ink2); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 22px; border:0; border-radius:999px; cursor:pointer; text-decoration:none;
    font-weight:700; color:var(--on-iris); background:linear-gradient(180deg, color-mix(in srgb, var(--iris2) 70%, var(--iris)), var(--iris));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 6px rgba(40,10,120,.35), 0 10px 26px -8px color-mix(in srgb, var(--iris) 80%, transparent);
    transition:transform .15s, filter .2s; }
  .btn:active { transform:scale(.97); }
  .btn.secondary { color:var(--ink); font-weight:600; background:var(--glass-hi); box-shadow:inset 0 1px 0 rgba(255,255,255,.2); border:1px solid var(--rim); }
  .btn.small { padding:8px 14px; font-size:14px; }
  .btn:disabled { opacity:.45; cursor:default; }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .estimate { margin-top:18px; padding:12px 16px; border-radius:var(--r-m); background:var(--field); font-size:14px; display:flex; justify-content:space-between; gap:12px; align-items:center; color:var(--ink2); }
  .estimate b { font-size:16px; white-space:nowrap; color:var(--ink); }
  .estimate.warn { outline:1px solid color-mix(in srgb, var(--warn) 60%, transparent); }
  .drop { border:1.5px dashed var(--rim); border-radius:var(--r-m); padding:18px; text-align:center; color:var(--ink2); font-size:14px; cursor:pointer; background:var(--field); }
  .drop:hover, .drop.over { border-color:var(--iris); color:var(--ink); }
  .drop input { display:none; }
  .thumbs { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  body.m-hist .gen { display:none; }
  .hist-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; color:var(--ink2); font-size:14px; }
  .hgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:6px; max-height:62vh; overflow:auto; border-radius:var(--r-m); }
  .hgrid button { position:relative; padding:0; border:0; border-radius:12px; overflow:hidden; aspect-ratio:1; background:var(--field); cursor:pointer; }
  .hgrid button.sel { outline:2px solid var(--iris); outline-offset:-2px; }
  .hgrid img { width:100%; height:100%; object-fit:cover; display:block; }
  .hgrid span { position:absolute; left:5px; bottom:5px; background:rgba(10,8,22,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:#fff; font-size:11px; padding:2px 7px; border-radius:999px; }
  .hempty { color:var(--ink2); font-size:14px; padding:20px 0; text-align:center; }
  .btn.danger { color:var(--err); }
  .thumb { position:relative; width:88px; height:88px; border-radius:14px; overflow:hidden; background:var(--field); border:1px solid var(--rim); }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb span { position:absolute; left:6px; top:6px; background:rgba(10,8,22,.6); color:#fff; font-size:11px; padding:1px 7px; border-radius:999px; }
  .thumb button { position:absolute; right:5px; top:5px; border:0; width:24px; height:24px; background:rgba(10,8,22,.6); color:#fff; border-radius:50%; cursor:pointer; }
  #paintWrap { position:relative; display:inline-block; max-width:100%; border-radius:var(--r-m); overflow:hidden; background:var(--field); margin-top:10px; touch-action:none; border:1px solid var(--rim); }
  #paintWrap img { display:block; max-width:100%; }
  #paintCanvas { position:absolute; left:0; top:0; width:100%; height:100%; cursor:crosshair; }
  .tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; font-size:14px; color:var(--ink2); }
  .tools input[type=range] { flex:1; min-width:90px; accent-color:var(--iris); }
  .seg { display:flex; background:var(--field); border-radius:999px; padding:3px; gap:2px; }
  .seg button { border:0; background:transparent; color:var(--ink2); padding:7px 14px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:600; }
  .seg button.on { background:var(--glass-hi); color:var(--ink); box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
  #result { display:flex; flex-direction:column; min-height:460px; }
  @media (max-width: 980px) { #result { min-height:0; } #result:not(:has(#stage[style*="block"])) { display:none; } }
  #resultEmpty { margin:auto; text-align:center; color:var(--ink2); }
  #resultEmpty .big { font-size:42px; margin-bottom:8px; }
  .stage { position:relative; width:100%; aspect-ratio:1/1; max-height:70vh; border-radius:var(--r-l); overflow:hidden; background:var(--field); display:none; }
  .stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transition:opacity .6s, filter .8s; }
  .stage img.preview, .stage img.final { filter:none; opacity:1; }
  .stage.has-preview .loader { background:rgba(0,0,0,.22); color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .stage.has-preview .loader .phase { color:#e6e6f0; }
  .stage.has-preview .loader .eta { background:rgba(0,0,0,.45); border-color:rgba(255,255,255,.25); color:#fff; text-shadow:none; }
  .shimmer { position:absolute; inset:0; background:linear-gradient(120deg, rgba(143,124,255,.10), rgba(185,169,255,.24), rgba(143,124,255,.10)); background-size:200% 100%; animation:shimmer 2.2s linear infinite; }
  @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  .orb { position:absolute; width:46%; aspect-ratio:1; border-radius:50%; filter:blur(40px); opacity:.55; animation:float 7s ease-in-out infinite; }
  .orb.a { background:#7d6cff; left:8%; top:10%; } .orb.b { background:#ff86c8; right:6%; bottom:8%; animation-delay:-3.5s; }
  @keyframes float { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(6%, -6%) scale(1.15); } }
  .loader { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; }
  .ring { width:60px; height:60px; border-radius:50%; border:4px solid rgba(143,124,255,.2); border-top-color:var(--iris); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader .stepbig { font-size:28px; font-weight:750; letter-spacing:-.02em; }
  .loader .phase { font-size:14px; color:var(--ink2); }
  .loader .eta { font-size:13px; padding:5px 12px; border-radius:999px; background:var(--glass-hi); border:1px solid var(--rim); }
  .bar { height:6px; background:var(--field); border-radius:999px; overflow:hidden; margin-top:14px; display:none; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--iris), var(--iris2)); transition:width .9s linear; }

<script>
// ------------------------------------------------------------ valeurs fixes
const RATIOS = { '1:1':[2048,2048], '4:3':[2400,1792], '3:4':[1792,2400], '3:2':[2528,1696], '2:3':[1696,2528], '16:9':[2752,1536], '9:16':[1536,2752] };
const RATIO_LABELS = { '1:1':'Carré 1:1', '4:3':'Paysage 4:3', '3:4':'Portrait 3:4', '3:2':'Paysage 3:2', '2:3':'Portrait 2:3', '16:9':'Large 16:9', '9:16':'Vertical 9:16' };
const RES   = [ {k:'low',label:'Low',scale:0.25}, {k:'medium',label:'Medium',scale:0.375}, {k:'high',label:'High',scale:0.5}, {k:'xhigh',label:'XHigh',scale:0.75}, {k:'max',label:'Max',scale:1.0} ];
const STEPS = [ {k:'low',label:'Low',steps:8}, {k:'medium',label:'Medium',steps:12}, {k:'high',label:'High',steps:20}, {k:'xhigh',label:'XHigh',steps:30}, {k:'max',label:'Max',steps:40} ];
const CFG = 1, MAX_PIXELS = 2048*2048, MAX_INPUT_SIDE = 2048, PREVIEW_EVERY = 5;
// coefficients d'estimation envoyés par /api/status (tools/estimate.py) : valeurs de départ du moteur, puis ajustées
// sur les générations mesurées de la machine. Même formule que estimate.predict() côté serveur.
let E = null, calibrated = false, lastE = '';
function applyEstimates(est){
  if(!est) return; calibrated = est.samples > 0;
  const key = JSON.stringify(est); if(key === lastE) return; lastE = key; E = est; refreshChoices();
}

const $ = id => document.getElementById(id);
let mode='t2i', editImages=[], maskImage=null, paintMode='paint', currentJob=null, lastResult=null, estSeconds=0, stepSeconds=0, vaeSeconds=0, forceImageRatio=false;

function log(m){ const l=$('log'); l.textContent += new Date().toLocaleTimeString()+'  '+m+'\n'; l.scrollTop=l.scrollHeight; }
const round32 = v => Math.max(256, Math.round(v/32)*32);
function singleImage(){ if(mode==='edit' && editImages.length===1) return editImages[0]; if(mode==='mask' && maskImage) return maskImage; return null; }
function closestRatio(w, h){ const t=Math.log(w/h); let best='1:1', bd=Infinity; for(const r in RATIOS){ const d=Math.abs(Math.log(RATIOS[r][0]/RATIOS[r][1])-t); if(d<bd){ bd=d; best=r; } } return best; }
function dimsExact(iw, ih, scale){ const px=MAX_PIXELS*scale*scale, r=iw/ih, h0=Math.sqrt(px/r); let best=null;
  for(const dh of [-32,0,32]){ const h=round32(h0+dh), w=round32(h*r); const err=Math.abs(Math.log((w/h)/r)), area=Math.abs(w*h-px)/px;
    if(!best || err<best.err-1e-9 || (Math.abs(err-best.err)<1e-9 && area<best.area)) best={w,h,err,area}; }
  return [best.w, best.h]; }
function dimsFor(key, scale){ const im=singleImage(); if(key==='image' && im) return dimsExact(im.w, im.h, scale); const [w,h]=RATIOS[key in RATIOS ? key : '1:1']; return [round32(w*scale), round32(h*scale)]; }
// réglages choisis, retenus par ce navigateur d'une visite à l'autre
const opt = { ratio:'1:1', res:'medium', steps:'medium' };
try{ Object.assign(opt, JSON.parse(localStorage.getItem('qwen-opt')||'{}')); }catch(e){}
function saveOpt(){ try{ localStorage.setItem('qwen-opt', JSON.stringify({...opt, preview:$('previewChk').checked})); }catch(e){} }
const resSel = () => RES.find(p=>p.k===opt.res) || RES[1];
const stepsSel = () => STEPS.find(p=>p.k===opt.steps) || STEPS[1];
function currentDims(){ return dimsFor(opt.ratio, resSel().scale); }
// pixels d'une référence telle que sd.cpp la donne au modèle : ramenée à la surface de la sortie, côtés multiples de 32
function refPx(rw, rh, w, h){ const vw=Math.sqrt(w*h*rw/rh), vh=vw*rh/rw, snap=x=>Math.max(32, Math.floor(x/32+0.5)*32); return snap(vw)*snap(vh); }
// références et image de départ envoyées au moteur pour le mode courant (voir buildBody)
function inputsFor(w, h){
  if(mode==='edit') return { refs: editImages.map(im=>refPx(im.w, im.h, w, h)), init: 0 };
  if(mode==='mask') return { refs: [w*h], init: $('mask_mode').value==='annotation' ? 0 : w*h };
  return { refs: [], init: 0 };
}
// étape = a·n + b·n² (n = jetons/1024, sortie + références) ; avec le cache de préfixe (E.kv), a·nt + b·nt·n (nt : jetons
// de la sortie), plus le préfixe calculé une fois (étape·nr/nt) ; encodage, VAE et part fixe : voir tools/estimate.py
function parts(w, h, steps, inp, preview){
  const R=inp.refs.reduce((t,p)=>t+p, 0)/1e6, I=inp.init/1e6, M=w*h/1e6, nt=w*h/256/1024, n=(w*h + R*1e6)/256/1024, p=E.kv ? nt : n;
  const step=E.a*p + E.b*p*n, prefix=E.kv ? step*(n-nt)/nt : 0, enc=E.o + E.e0 + E.e1*R + E.u*(R+I) + prefix, vae=E.v*M;
  const previews = preview ? Math.floor(steps/PREVIEW_EVERY) : 0;
  return { step, enc, vae, previews, total: enc + steps*step + vae + previews*vae }; }
function fmt(s){ if(s<90) return Math.round(s)+' s'; if(s<3600) return Math.round(s/60)+' min'; return (s/3600).toFixed(1).replace('.',',')+' h'; }

const RATIO_NAMES = { '1:1':'Carré', '4:3':'Paysage', '3:4':'Portrait', '3:2':'Paysage', '2:3':'Portrait', '16:9':'Large', '9:16':'Vertical' };
const shape = (w, h, size) => { const k=size/Math.max(w,h); return `<i class="shape" style="width:${Math.max(6,Math.round(w*k))}px;height:${Math.max(6,Math.round(h*k))}px"></i>`; };
function refreshChoices(){
  const im=singleImage(); const nrefs = mode==='edit' ? editImages.length : 0; const pv=$('previewChk').checked;
  if(opt.ratio==='image' && !im) opt.ratio='1:1'; if(!(opt.ratio in RATIOS) && opt.ratio!=='image') opt.ratio='1:1';
  if(forceImageRatio && im) opt.ratio='image'; forceImageRatio=false;
  const near = im ? closestRatio(im.w, im.h) : null;
  const ratioDims = r => r==='image' ? [im.w, im.h] : RATIOS[r];
  $('ratioOpts').innerHTML = (im ? ['image'] : []).concat(Object.keys(RATIOS)).map(r=>{ const [rw,rh]=ratioDims(r), on=r===opt.ratio;
    return `<button class="opt ratio${on?' on':''}${r===near?' near':''}" data-k="${r}" aria-pressed="${on}"${r===near?' title="Proche des proportions de l\'image"':''}>${shape(rw,rh,26)}<b>${r==='image'?'Image':r}</b><small>${r==='image'?im.w+'×'+im.h:RATIO_NAMES[r]}</small></button>`; }).join('');
  const steps=stepsSel().steps; const [w,h]=currentDims(); const inp=inputsFor(w, h);
  $('resOpts').innerHTML = RES.map(p=>{ const [pw,ph]=dimsFor(opt.ratio, p.scale), on=p.k===opt.res;
    return `<button class="opt${on?' on':''}" data-k="${p.k}" aria-pressed="${on}"><b>${p.label}</b><small>${pw}×${ph}</small></button>`; }).join('');
  const approx = s => E ? '≈ '+fmt(s) : '…';     // avant le premier /api/status, pas de coefficients
  $('stepOpts').innerHTML = STEPS.map(p=>{ const on=p.k===opt.steps;
    return `<button class="opt${on?' on':''}" data-k="${p.k}" aria-pressed="${on}" title="${p.label}"><b>${p.steps}</b><small>${approx(E && parts(w,h,p.steps,inp,pv).total)}</small></button>`; }).join('');
  const [rw,rh] = ratioDims(opt.ratio);
  $('pills').innerHTML = `<button class="pill" data-open>${shape(rw,rh,16)}${opt.ratio==='image'?'Image':opt.ratio}</button>`
    + `<button class="pill" data-open>${w}×${h}</button><button class="pill" data-open>${steps} étapes</button>`
    + (pv ? `<button class="pill" data-open>Aperçus</button>` : '') + (nrefs>1 ? `<button class="pill dim" data-open>${nrefs} références</button>` : '');
  $('estText').textContent=`${w}×${h} · ${steps} étapes${nrefs>1?' · '+nrefs+' références':''}`;
  if(!E){ estSeconds=0; $('previewCost').textContent=''; $('estTime').textContent=$('goEta').textContent='…'; return; }
  const pr=parts(w,h,steps,inp,pv); estSeconds=pr.total; stepSeconds=pr.step; vaeSeconds=pr.vae;
  $('previewCost').textContent = `(+ ${fmt(parts(w,h,steps,inp,true).previews*pr.vae)})`;
  $('estTime').textContent=$('goEta').textContent='≈ '+fmt(estSeconds);
  $('estimate').classList.toggle('warn', estSeconds>3600); $('goEta').classList.toggle('warn', estSeconds>3600);
}
(function init(){
  try{ $('previewChk').checked = !!JSON.parse(localStorage.getItem('qwen-opt')||'{}').preview; }catch(e){}
  [['ratioOpts','ratio'],['resOpts','res'],['stepOpts','steps']].forEach(([id,key])=>$(id).addEventListener('click', e=>{
    const b=e.target.closest('[data-k]'); if(!b) return; opt[key]=b.dataset.k; saveOpt(); refreshChoices(); }));
  $('pills').addEventListener('click', e=>{ if(e.target.closest('[data-open]')) openSheet('setSheet'); });
  ['previewChk','mask_mode'].forEach(id=>$(id).addEventListener('change', ()=>{ saveOpt(); refreshChoices(); })); refreshChoices();
  // brouillons des trois textes, retenus par ce navigateur
  ['t2i_prompt','edit_prompt','mask_prompt'].forEach(id=>{ const t=$(id);
    try{ t.value = localStorage.getItem('qwen-'+id) || ''; }catch(e){}
    t.addEventListener('input', ()=>{ try{ localStorage.setItem('qwen-'+id, t.value); }catch(e){} }); });
})();
function suggestRatio(){ forceImageRatio=!!singleImage(); refreshChoices(); }

// ------------------------------------------------------------ fond ambiant : miniature de l'image affichée, floutée en CSS
let ambName=null, ambFlip=false;
function setAmbient(name){
  if(!name || name===ambName) return; ambName=name;
  const next=$(ambFlip?'ambA':'ambB'), prev=$(ambFlip?'ambB':'ambA'); ambFlip=!ambFlip;
  next.onload=()=>{ next.classList.add('on'); prev.classList.remove('on'); };
  next.src='/api/thumb?name='+encodeURIComponent(name);
}
(async function initAmbient(){ try{ const h=await (await fetch('/api/history')).json(); if(h.length && !ambName) setAmbient(h[0].name); }catch(e){} })();

// ------------------------------------------------------------ onglets & statut
const TABS=[...document.querySelectorAll('#tabbar button')];
function placeLens(){ const i=TABS.findIndex(b=>b.dataset.pane===mode); $('lens').style.transform=`translateX(${i*100}%)`; }
TABS.forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.pane===mode) return window.scrollTo({top:0, behavior:'smooth'});
  TABS.forEach(x=>x.classList.toggle('active', x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active')); mode=b.dataset.pane; $('pane-'+mode).classList.add('active');
  document.body.className='m-'+mode; placeLens(); if(mode==='hist') loadHistory(); suggestRatio(); }));
document.body.className='m-'+mode;

// ------------------------------------------------------------ panneaux du bas : un seul ouvert à la fois
let openedSheet=null;
function openSheet(id){ closeSheet(); openedSheet=$(id); openedSheet.classList.add('on'); $('scrim').classList.add('on'); }
function closeSheet(){ if(!openedSheet) return; openedSheet.classList.remove('on'); $('scrim').classList.remove('on'); openedSheet=null; }
addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
// glisser le panneau vers le bas pour le fermer
document.querySelectorAll('.sheet').forEach(sh=>{ let y0=null, dy=0;
  sh.addEventListener('touchstart', e=>{ y0 = sh.scrollTop<=0 ? e.touches[0].clientY : null; dy=0; }, {passive:true});
  sh.addEventListener('touchmove', e=>{ if(y0===null) return; dy=Math.max(0, e.touches[0].clientY-y0); if(dy>0){ sh.style.transition='none'; sh.style.transform=`translate(-50%, ${dy}px)`; } }, {passive:true});
  sh.addEventListener('touchend', ()=>{ if(y0===null) return; sh.style.transition=''; sh.style.transform=''; if(dy>90) closeSheet(); y0=null; }); });
const esc = t => String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function facts(id, rows){ $(id).innerHTML=rows.filter(r=>r[1]!=null && r[1]!=='').map(([k,v,cls])=>`<dt>${esc(k)}</dt><dd class="${cls||''}">${esc(v)}</dd>`).join(''); }
async function refreshStatus(){
  try{ const s=await (await fetch('/api/status')).json(); const el=$('status');
    // adresse et code d'accès pour le téléphone : envoyés seulement quand la page est ouverte sur le Mac
    $('phone').hidden=$('phoneBtn').hidden=!s.phone; if(s.phone) facts('phoneFacts', [['Adresse', s.phone.urls[0]], ...s.phone.urls.slice(1).map(u=>['ou', u]), ['Code', s.phone.code, 'code']]);
    const ver = s.model_version ? s.model_version.toUpperCase() : '';
    if(s.sd_ready){ applyEstimates(s.estimates); el.textContent=(s.busy?'En cours':'Prêt')+(ver?' · '+ver:''); el.className='ok'; } else { el.textContent='Non prêt'; el.className='err'; }
    facts('engineFacts', [['État', s.sd_ready ? (s.busy ? 'génération en cours' : 'prêt') : (s.detail||'non prêt')], ['Moteur', s.backend], ['Modèle', s.model],
      ['File d\'attente', s.queued ? s.queued+' en attente' : ''], ['Estimations', !s.estimates ? '' : calibrated ? 'calibrées sur '+s.estimates.samples+' mesure'+(s.estimates.samples>1?'s':'') : 'non calibrées']]); }
  catch(e){ $('status').textContent='Hors ligne'; $('status').className='err'; facts('engineFacts', [['État', 'serveur injoignable']]); }
  setTimeout(refreshStatus, 5000);
}
refreshStatus();

// ------------------------------------------------------------ images
function readFile(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); }); }
function loadImg(dataUrl){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=dataUrl; }); }
function resizeDataUrl(img, w, h){ const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); return c.toDataURL('image/png'); }
async function toEntry(name, dataUrl){ let im=await loadImg(dataUrl); let w=im.naturalWidth, h=im.naturalHeight;
  if(Math.max(w,h)>MAX_INPUT_SIDE){ const s=MAX_INPUT_SIDE/Math.max(w,h); const nw=Math.round(w*s), nh=Math.round(h*s);
    dataUrl=resizeDataUrl(im, nw, nh); im=await loadImg(dataUrl); log(`${name} : ${w}×${h} réduite à ${nw}×${nh}`); w=nw; h=nh; }
  return {name, dataUrl, w, h, img:im}; }
function wireDrop(dropId, inputId, handler){ const d=$(dropId), inp=$(inputId); d.addEventListener('click',()=>inp.click());
  d.addEventListener('dragover',e=>{e.preventDefault(); d.classList.add('over');}); d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault(); d.classList.remove('over'); handler(e.dataTransfer.files);}); inp.addEventListener('change',e=>{ handler(e.target.files); e.target.value=''; }); }
wireDrop('edit_drop','edit_files', async files=>{ for(const f of files){ if(editImages.length>=10) break; editImages.push(await toEntry(f.name, await readFile(f))); } renderEditThumbs(); suggestRatio(); });
wireDrop('mask_drop','mask_file', async files=>{ const f=files[0]; if(f) await setMaskImage(f.name, await readFile(f)); });
function renderEditThumbs(){ const t=$('edit_thumbs'); t.innerHTML='';
  editImages.forEach((im,i)=>{ const d=document.createElement('div'); d.className='thumb'; d.innerHTML=`<img src="${im.dataUrl}"><span>${i+1}</span><button title="retirer">×</button>`;
    d.querySelector('button').onclick=()=>{ editImages.splice(i,1); renderEditThumbs(); suggestRatio(); }; t.appendChild(d); }); }

// ------------------------------------------------------------ dessin
const canvas=$('paintCanvas'); const ctx=canvas.getContext('2d');
$('brush').addEventListener('input',e=>$('brushVal').textContent=e.target.value+' px');
$('modePaint').onclick=()=>{paintMode='paint'; $('modePaint').classList.add('on'); $('modeErase').classList.remove('on');};
$('modeErase').onclick=()=>{paintMode='erase'; $('modeErase').classList.add('on'); $('modePaint').classList.remove('on');};
async function setMaskImage(name, dataUrl){ maskImage=await toEntry(name, dataUrl); $('paintImg').src=maskImage.dataUrl; $('paintWrap').style.display='inline-block';
  canvas.width=maskImage.w; canvas.height=maskImage.h; ctx.clearRect(0,0,canvas.width,canvas.height); suggestRatio(); }
function clearMask(){ ctx.clearRect(0,0,canvas.width,canvas.height); }
let drawing=false, last=null;
function pos(ev){ const r=canvas.getBoundingClientRect(); return [(ev.clientX-r.left)*canvas.width/r.width, (ev.clientY-r.top)*canvas.height/r.height]; }
function dab(p){ const size=Number($('brush').value)*canvas.width/canvas.getBoundingClientRect().width;
  ctx.globalCompositeOperation = paintMode==='erase' ? 'destination-out' : 'source-over'; ctx.strokeStyle='rgba(255,0,0,0.5)'; ctx.fillStyle='rgba(255,0,0,0.5)'; ctx.lineWidth=size; ctx.lineCap='round'; ctx.lineJoin='round';
  if(last){ ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); } else { ctx.beginPath(); ctx.arc(p[0],p[1],size/2,0,Math.PI*2); ctx.fill(); } last=p; }
canvas.addEventListener('pointerdown',ev=>{ if(!maskImage) return; drawing=true; last=null; canvas.setPointerCapture(ev.pointerId); dab(pos(ev)); });
canvas.addEventListener('pointermove',ev=>{ if(drawing) dab(pos(ev)); });
['pointerup','pointercancel','pointerleave'].forEach(t=>canvas.addEventListener(t,()=>{ drawing=false; last=null; }));
function paintedPixels(){ const d=ctx.getImageData(0,0,canvas.width,canvas.height); let n=0; for(let i=3;i<d.data.length;i+=4) if(d.data[i]>0) n++; return n; }
function exportMask(w,h){ const d=ctx.getImageData(0,0,canvas.width,canvas.height); const m=document.createElement('canvas'); m.width=canvas.width; m.height=canvas.height; const mc=m.getContext('2d'); const out=mc.createImageData(m.width,m.height);
  for(let i=0;i<d.data.length;i+=4){ const v=d.data[i+3]>0?255:0; out.data[i]=v; out.data[i+1]=v; out.data[i+2]=v; out.data[i+3]=255; }
  mc.putImageData(out,0,0); const f=document.createElement('canvas'); f.width=w; f.height=h; const fc=f.getContext('2d'); fc.imageSmoothingEnabled=false; fc.drawImage(m,0,0,w,h); return f.toDataURL('image/png'); }
function paintedReference(w,h,opaque){ const a=document.createElement('canvas'); a.width=canvas.width; a.height=canvas.height; const ac=a.getContext('2d'); ac.drawImage(maskImage.img,0,0,a.width,a.height);
  const d=ctx.getImageData(0,0,canvas.width,canvas.height); const im=ac.getImageData(0,0,a.width,a.height);
  for(let i=0;i<d.data.length;i+=4){ if(d.data[i+3]>0){ if(opaque){ im.data[i]=255; im.data[i+1]=0; im.data[i+2]=0; } else { im.data[i]=Math.round(im.data[i]*0.5+127); im.data[i+1]=Math.round(im.data[i+1]*0.5); im.data[i+2]=Math.round(im.data[i+2]*0.5); } } }
  ac.putImageData(im,0,0); const f=document.createElement('canvas'); f.width=w; f.height=h; f.getContext('2d').drawImage(a,0,0,w,h); return f.toDataURL('image/png'); }

// ------------------------------------------------------------ requête & loader
function buildRequest(){
  const [w,h]=currentDims(); const steps=stepsSel().steps;
  const body={ mode, prompt:'', width:w, height:h, steps, cfg:CFG, seed:-1, preview:$("previewChk").checked, preview_interval:PREVIEW_EVERY, ref_images:[], init_image:null, mask_image:null, strength:1.0 };
  if(mode==='t2i'){ body.prompt=$('t2i_prompt').value.trim(); }
  else if(mode==='edit'){ if(!editImages.length) throw new Error('Ajoutez au moins une image de référence.'); body.prompt=$('edit_prompt').value.trim(); body.ref_images=editImages.map(x=>x.dataUrl); }
  else { if(!maskImage) throw new Error('Chargez une image.'); if(!paintedPixels()) throw new Error('Peignez une zone.'); body.prompt=$('mask_prompt').value.trim();
    if($('mask_mode').value==='annotation'){ body.mode='annot'; body.ref_images=[paintedReference(w,h,true)]; }
    else { body.init_image=resizeDataUrl(maskImage.img,w,h); body.mask_image=exportMask(w,h); body.ref_images=[paintedReference(w,h,false)]; } }
  if(!body.prompt) throw new Error('Le texte est vide.');
  return body;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showLoader(on){ $('stage').style.display='block'; $('resultEmpty').style.display='none'; $('loader').style.display=on?'flex':'none'; $('shimmer').style.display=on?'block':'none'; $('bar').style.display=on?'block':'none'; }
function updateLoader(j, elapsed){
  let remaining, frac;
  if(j.step){ const spi=j.sec_per_it_recent||j.sec_per_it||stepSeconds;   // moyenne des derniers pas mesurés
    const previewsLeft = j.preview_interval ? Math.floor((j.total-j.step)/j.preview_interval) : 0;
    remaining=(j.total-j.step)*spi + vaeSeconds*(1+previewsLeft); frac=j.step/j.total; $('stepBig').textContent=`Étape ${j.step} / ${j.total}`; $('phaseTxt').textContent=`${spi.toFixed(1)} s par étape`; }
  else { remaining=Math.max(0, estSeconds-elapsed); frac=Math.min(0.12, elapsed/Math.max(estSeconds,1)); $('stepBig').textContent=j.status==='queued'?'En attente':'Préparation'; $('phaseTxt').textContent=(j.phase||'chargement')+'…'; }
  if(j.phase==='décodage VAE'){ frac=0.97; remaining=vaeSeconds; $('stepBig').textContent='Décodage'; $('phaseTxt').textContent=''; }
  $('etaTxt').textContent=`${fmt(elapsed)} · reste ≈ ${fmt(remaining)}`; $('bar').firstElementChild.style.width=(Math.max(frac,0.02)*100).toFixed(1)+'%';
}
async function followJob(j, startedAt){          // suit un job (nouveau ou repris après rechargement de la page)
  $('go').disabled=true; $('cancel').disabled=false; showLoader(true); $('resultActions').style.display='none'; $('resultMeta').textContent='';
  const img=$('stageImg'); img.className=''; img.src=''; img.style.display='none'; let pv=0; currentJob=j.id; $('stage').classList.remove('has-preview');
  try{
    while(['queued','running'].includes(j.status)){ await sleep(1000); j=await (await fetch('/api/job/'+j.id)).json(); const el=(Date.now()-startedAt)/1000; updateLoader(j, el);
      if(j.preview_version && j.preview_version!==pv){ pv=j.preview_version; img.src='/api/job/'+j.id+'/preview?v='+pv; img.className='preview'; img.style.display='block'; $('stage').classList.add('has-preview'); $('shimmer').style.display='none'; } }
    if(j.status==='cancelled'){ log('génération annulée'); showLoader(false); $('stage').classList.remove('has-preview'); if(!lastResult){ $('stage').style.display='none'; $('resultEmpty').style.display='block'; } return; }
    if(j.status!=='done') throw new Error(j.error||('statut '+j.status));
    $('stage').classList.remove('has-preview');
    const secs=j.seconds||(Date.now()-startedAt)/1000; const url='/api/result?name='+encodeURIComponent(j.name);
    if(j.dims) $('stage').style.aspectRatio=j.dims[0]+'/'+j.dims[1];
    img.src=url; img.className='final'; img.style.display='block'; showLoader(false); $('stage').style.display='block';
    $('dl').href=url+'&download=1'; $('dl').download=j.name; $('resultActions').style.display='flex';
    if(mode==='hist') loadHistory();
    $('resultMeta').textContent=`${fmt(secs)} (${Math.round(secs)} s) · ${j.dims?j.dims.join('×'):''} · ${j.total||'?'} étapes${j.sec_per_it?' · '+j.sec_per_it.toFixed(1)+' s/étape':''}\n${j.path}\n${(j.size||0).toLocaleString('fr-FR')} octets`;
    lastResult={url, name:j.name}; setAmbient(j.name); log('terminé en '+Math.round(secs)+' s → '+j.path);
  }catch(e){ log('ERREUR '+e.message); showLoader(false); if(!lastResult){ $('stage').style.display='none'; $('resultEmpty').style.display='block'; } alert('Erreur : '+e.message); }
  finally{ $('go').disabled=false; $('cancel').disabled=true; currentJob=null; }
}
$('go').onclick=async()=>{
  let body; try{ body=buildRequest(); }catch(e){ alert(e.message); return; }
  if(estSeconds>3600 && !confirm('Temps estimé : '+fmt(estSeconds)+'. Lancer quand même ?')) return;
  $('stage').style.aspectRatio=body.width+'/'+body.height;
  log(`${body.mode} ${body.width}x${body.height} ${body.steps} étapes refs=${body.ref_images.length} mask=${body.mask_image?'oui':'non'} aperçus=${body.preview?'oui':'non'} estimation=${fmt(estSeconds)}`);
  const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok){ alert('Erreur : '+(j.error||('HTTP '+r.status))); return; }
  await followJob(j, Date.now());
};
(async function resumeIfRunning(){          // après un rechargement : se rattache à la génération en cours ou affiche la dernière
  try{ const s=await (await fetch('/api/status')).json(); const j=s.last_job; if(!j) return;
    if(['queued','running'].includes(j.status)){ log('reprise du job en cours '+j.id); await followJob(j, j.started ? j.started*1000 : Date.now()); }
    else if(j.status==='done'){ const url='/api/result?name='+encodeURIComponent(j.name); const img=$('stageImg'); if(j.dims) $('stage').style.aspectRatio=j.dims[0]+'/'+j.dims[1];
      showLoader(false); img.src=url; img.className='final'; img.style.display='block'; $('dl').href=url+'&download=1'; $('dl').download=j.name; $('resultActions').style.display='flex';
      $('resultMeta').textContent=`dernière génération · ${fmt(j.seconds||0)} · ${j.dims?j.dims.join('×'):''}\n${j.path}`; lastResult={url, name:j.name}; setAmbient(j.name); }
  }catch(e){} })();
async function cancelCurrent(){ if(currentJob){ log('annulation demandée'); await fetch('/api/job/'+currentJob+'/cancel',{method:'POST'}); } }
$('cancel').onclick=cancelCurrent; $('cancelLoader').onclick=cancelCurrent;
// ------------------------------------------------------------ historique
let histItems=[];
const MODE_LABELS={ t2i:'Texte → image', edit:'Édition', mask:'Masque', annot:'Annotation' };
async function loadHistory(){
  try{ histItems=await (await fetch('/api/history')).json(); }catch(e){ $('histCount').textContent='historique indisponible'; return; }
  const g=$('histGrid'); g.innerHTML='';
  $('histCount').textContent = histItems.length ? histItems.length+' image'+(histItems.length>1?'s':'') : '';
  if(!histItems.length){ g.innerHTML='<div class="hempty">Aucune image pour l\'instant.</div>'; return; }
  histItems.forEach(it=>{ const b=document.createElement('button'); b.title=it.prompt||it.name; b.dataset.name=it.name;
    if(lastResult && lastResult.name===it.name) b.classList.add('sel');
    const im=document.createElement('img'); im.loading='lazy'; im.alt=''; im.src='/api/thumb?name='+encodeURIComponent(it.name)+'&t='+it.time; b.appendChild(im);
    if(it.mode){ const sp=document.createElement('span'); sp.textContent=MODE_LABELS[it.mode]||it.mode; b.appendChild(sp); }
    b.onclick=()=>showHistoryItem(it); g.appendChild(b); });
}
function showHistoryItem(it){
  if(currentJob) return;     // pendant une génération, le panneau de droite suit la génération
  const url='/api/result?name='+encodeURIComponent(it.name), img=$('stageImg');
  showLoader(false); $('stage').classList.remove('has-preview');      // affiche le panneau sans l'animation d'attente
  if(it.width && it.height) $('stage').style.aspectRatio=it.width+'/'+it.height;
  img.src=url; img.className='final'; img.style.display='block';
  $('dl').href=url+'&download=1'; $('dl').download=it.name; $('resultActions').style.display='flex';
  const date=new Date(it.time*1000).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'});
  $('resultMeta').textContent=[date+(it.mode?' · '+(MODE_LABELS[it.mode]||it.mode):'')+(it.width?' · '+it.width+'×'+it.height:'')
    +(it.steps?' · '+it.steps+' étapes':'')+(it.model?' · '+it.model.toUpperCase():'')+(it.seconds?' · '+fmt(it.seconds):''),
    it.prompt||'', it.name].filter(Boolean).join('\n');
  lastResult={url, name:it.name}; setAmbient(it.name);
  document.querySelectorAll('#histGrid button').forEach(x=>x.classList.toggle('sel', x.dataset.name===it.name));
  if(window.innerWidth<=980) $('result').scrollIntoView({behavior:'smooth', block:'start'});   // téléphone : panneau sous la liste
}
async function deleteCurrent(){
  if(!lastResult || currentJob) return;
  if(!confirm('Supprimer définitivement '+lastResult.name+' ?')) return;
  const r=await fetch('/api/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:lastResult.name})});
  if(!r.ok){ alert('Suppression impossible : '+((await r.json()).error||r.status)); return; }
  log('supprimé : '+lastResult.name); lastResult=null;
  $('stageImg').src=''; $('stage').style.display='none'; $('resultActions').style.display='none'; $('resultMeta').textContent=''; $('resultEmpty').style.display='block';
  loadHistory();
}
async function fetchLastDataUrl(){ const b=await (await fetch(lastResult.url)).blob(); return await readFile(b); }
async function useAsEditInput(){ if(!lastResult) return; editImages.push(await toEntry(lastResult.name, await fetchLastDataUrl())); renderEditThumbs(); document.querySelector('nav button[data-pane=edit]').click(); }
async function useAsMaskInput(){ if(!lastResult) return; await setMaskImage(lastResult.name, await fetchLastDataUrl()); document.querySelector('nav button[data-pane=mask]').click(); }
</script>
