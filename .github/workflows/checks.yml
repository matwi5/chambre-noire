# Contrôles du projet sur chaque pull request vers main et chaque push sur dev : la même commande qu'en local
# (tests/check.py : compilation, JavaScript de l'interface, longueur des lignes ajoutées, banc de test sans GPU).
# Les tests d'interface (--ui) demandent Chrome et restent en local. macOS, comme le poste de référence : le banc y suit les mêmes branches
# (moteur Metal, écritures F_FULLFSYNC) ; minutes gratuites pour un dépôt public.
name: Contrôles

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # historique et origin/main : check.py juge les lignes ajoutées depuis la base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dépendances Python
        run: python -m pip install -r requirements.txt
      - name: Contrôles (tests/check.py)
        run: python tests/check.py
